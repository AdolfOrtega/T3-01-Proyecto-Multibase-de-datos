version: '3.8'

services:
  # 1. Base de datos Relacional (MySQL)
  mysql:
    image: mysql:8.0
    container_name: multibase_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: multibase_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  # 2. Base de datos NoSQL Documental (MongoDB)
  mongodb:
    image: mongo:latest
    container_name: multibase_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # 3. Base de datos Clave-Valor (Redis)
  redis:
    image: redis:alpine
    container_name: multibase_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  mongo_data:
  redis_data:
